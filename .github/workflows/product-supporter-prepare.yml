name: Prepare product Supporter DNFT (reusable)
# Called by any Decent dapp (see templates/supporter/). Renders the card from the dapp's tagged site,
# pins source + runnable site + art + metadata, freezes supporter-release.json and opens the steward
# mint issue in the CALLER repository. Submits no transactions.
on:
  workflow_call:
    inputs:
      tag:
        description: Published release tag in the caller repository
        required: true
        type: string
      head_ref:
        description: Full DecentHead commit SHA; must equal the ref in the caller's uses line
        required: true
        type: string
      release_date:
        description: Optional canonical UTC release date; defaults to the release's published_at
        required: false
        type: string
        default: ''
      product_name:
        description: Card title, e.g. BigNuten (defaults to the repository name)
        required: false
        type: string
        default: ''
      tagline:
        description: One-line card tagline
        required: false
        type: string
        default: ''
      ens_name:
        description: ENS name to point at the release site after mint (pass vars.SUPPORTER_ENS_NAME)
        required: false
        type: string
        default: ''
      ens_rpc_url:
        description: Public credential-free Ethereum mainnet RPC
        required: false
        type: string
        default: https://ethereum-rpc.publicnode.com
    secrets:
      PINATA_JWT:
        required: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate kit pin
        env:
          HEAD_REF: ${{ inputs.head_ref }}
        run: |
          if ! [[ "$HEAD_REF" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::head_ref must be a full DecentHead commit SHA"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          path: product
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TheJollyLaMa/DecentHead
          ref: ${{ inputs.head_ref }}
          path: head
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Provision renderer
        working-directory: head
        run: npm ci && npx playwright install --with-deps chromium
      - name: Render card from the tagged product site
        working-directory: product
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_DATE: ${{ inputs.release_date || github.event.release.published_at }}
          ENS_RPC_URL: ${{ inputs.ens_rpc_url }}
          PRODUCT_NAME: ${{ inputs.product_name }}
          TAGLINE: ${{ inputs.tagline }}
          BASE_URL: http://127.0.0.1:8790
          PRODUCT_URL: http://127.0.0.1:8791/
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$RELEASE_DATE" ]; then
            RELEASE_DATE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt -q .publishedAt)"
          fi
          export RELEASE_DATE="$(node -e 'process.stdout.write(new Date(process.env.RELEASE_DATE).toISOString())')"
          echo "RELEASE_DATE=$RELEASE_DATE" >> "$GITHUB_ENV"
          python3 -m http.server 8790 --bind 127.0.0.1 --directory ../head > ../head-server.log 2>&1 &
          head_pid=$!
          python3 -m http.server 8791 --bind 127.0.0.1 --directory . > ../product-server.log 2>&1 &
          product_pid=$!
          trap 'kill "$head_pid" "$product_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --output /dev/null "$BASE_URL/supporter/product-card.html" && curl --fail --silent --output /dev/null "$PRODUCT_URL"; then break; fi
            sleep 1
          done
          node ../head/scripts/render-product-supporter.mjs "$TAG"
        shell: bash
      - name: Archive, pin, annotate release and open steward issue
        working-directory: product
        env:
          TAG: ${{ inputs.tag }}
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          SUPPORTER_ENS_NAME: ${{ inputs.ens_name }}
          GH_TOKEN: ${{ github.token }}
        run: node ../head/scripts/prepare-supporter-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supporter-dnft-preparation
          if-no-files-found: ignore
          path: |
            product/supporter-preview.png
            product/supporter-front.png
            product/supporter-back.png
            product/supporter-presentation.html
            product/supporter-metadata.json
            product/supporter-release.json
            product/supporter-mint-issue.md
