name: Test DecentHead
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Check first-party JavaScript syntax
        run: find js scripts -name '*.js' -not -path 'js/vendor/*' -o -name '*.mjs' | xargs -n 1 node --check
